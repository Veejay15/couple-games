      <div class="stage">
        <p class="eyebrow">Round ${S.round} · Hot Seat</p>
        <p class="sub"><b>${esc(nm(w))}</b> asks. <b>${esc(nm(l))}</b> answers.</p>
        ${cardHTML(S.card, "Hot question", "🔥", S.card.for === "both" ? `Brave bonus: ${esc(nm(w))} answers it too.` : "")}
      </div>
      <div class="actions">
        <button class="btn primary" data-act="answered">Answered — next round</button>
        <button class="btn ghost" data-act="passhot" ${S.passes[l] ? "" : "disabled"}>${S.passes[l] ? `Pass (${S.passes[l]} left)` : "No passes left"}</button>
      </div>`;
  },

  end() {
    const [a, b] = S.lost;
    let msg;
    if (a === b) {
      msg = `<p class="headline">It's a tie.</p><p class="sub">You each owe the other one long goodnight kiss. 💋</p>`;
    } else {
      const loser = a > b ? 0 : 1;
      msg = `<p class="headline"><b>${esc(nm(1 - loser))}</b> wins the night.</p>
             <p class="sub">${esc(nm(loser))} owes…</p>
             <div class="card h3"><div class="card-badge">🎁</div><div class="card-kind">Final forfeit</div><p class="card-text">${esc(S.forfeit).replace(/\{winner\}/g, `<b>${esc(nm(1 - loser))}</b>`)}</p></div>`;
    }
    return `
      <div class="stage">
        <div class="logo">💞</div>
        <h1 style="font-size:36px">That's a night.</h1>
        <p class="tag">${esc(nm(0))} lost ${a} · ${esc(nm(1))} lost ${b}</p>
        ${msg}
      </div>
      <div class="actions">
        <button class="btn primary" data-act="again">Play again</button>
        <button class="btn ghost" data-act="home">Back to start</button>
      </div>`;
  },

  custom() {
    const types = { truth: "Truth", dare: "Dare", hot: "Hot question", duel: "Duel" };
    const list = custom.length
      ? `<ul class="custom-list">${custom.map((c, i) => `
          <li><div><small>${types[c.type]} · ${HEAT[c.h].icon} ${HEAT[c.h].name}${c.for && c.for !== "both" ? ` · ${FOR[c.for]}` : ""}</small>${esc(c.text.split("|")[0])}</div>
          <button data-act="del" data-i="${i}" aria-label="Delete">✕</button></li>`).join("")}</ul>`
      : `<p class="empty">No cards of your own yet.</p>`;
    return `
      <div class="topbar"><div class="brand">Our <span>cards</span></div><button class="icon-btn" data-act="back">← Back</button></div>
      <div class="panel">
        <label for="ctype">Type</label>
        <select id="ctype">${Object.entries(types).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>
        <label for="cfor">For</label>
        <select id="cfor">${Object.entries(FOR).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>
        <div class="label">Heat</div>
        <div class="seg" id="cheat">${LEVELS.map(h => `<button data-act="cheat" data-v="${h}" class="${h === customHeat ? "on" : ""}">${HEAT[h].icon} ${HEAT[h].name}</button>`).join("")}</div>
        <label for="ctext">Card</label>
        <textarea id="ctext" maxlength="240" placeholder="e.g. Tell {winner} the moment you first knew. Add |60 at the end for a 60-second timer."></textarea>
        <button class="btn primary" data-act="add">Add card</button>
      </div>
      ${list}
      <p class="empty" style="margin-top:14px">Saved on this device only. They mix into the deck with the built-in cards.</p>`;
  }
};

function render() {
  stopTimer();
  document.getElementById("app").innerHTML = views[S.phase]();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  save();
}

/* --------------------------- actions --------------------------- */
function nextRound() {
  S.round++;
  S.loser = null;
  S.kind = null;
  S.card = draw("duel");
  S.phase = "duel";
}

let customHeat = 2;
let fating = false;

const actions = {
  mode(el) { S.mode = el.dataset.v; document.querySelectorAll("[data-act=mode]").forEach(b => b.classList.toggle("on", b === el)); save(); },
  role(el) {
    const i = Number(el.dataset.i);
    S.roles[i] = el.dataset.v;
    document.querySelectorAll(`[data-act=role][data-i="${i}"]`).forEach(b => b.classList.toggle("on", b === el));
    save();
  },
  start() {
    const n1 = document.getElementById("n1").value.trim(), n2 = document.getElementById("n2").value.trim();
    S = freshGame([n1, n2], S.mode, S.roles);
    S.card = draw("duel");
    S.phase = "duel";
    keepAwake();
    render();
  },
  resume() {
    S.names = [document.getElementById("n1").value.trim(), document.getElementById("n2").value.trim()];
    S.phase = S.loser === null ? "duel" : S.card && S.kind ? (S.card.type === "hot" ? "hot" : "card") : "choose";
    if (!S.card) S.card = draw("duel");
    keepAwake();
    render();
  },
  lost(el) { S.loser = Number(el.dataset.i); S.lost[S.loser]++; S.phase = "choose"; render(); },
  fate() {
    if (fating) return;
    fating = true;
    const out = document.getElementById("fate");
    let n = 0;
    const spin = setInterval(() => {
      out.textContent = nm(n++ % 2);
      if (n > 14) {
        clearInterval(spin);
        const pick = Math.random() < 0.5 ? 0 : 1;
        out.textContent = `${nm(pick)} 🎲`;
        setTimeout(() => { fating = false; actions.lost({ dataset: { i: pick } }); }, 900);
      }
    }, 90);
  },
  reduel() { S.card = draw("duel"); render(); },
  pick(el) { S.kind = el.dataset.v; S.swapped = false; S.card = draw(S.kind); S.phase = "card"; render(); },
  // Refusing a dare is free, but the loser has to answer a truth instead.
  totruth() { S.kind = "truth"; S.swapped = true; S.card = draw("truth"); render(); },
  done() {
    // Truth and Hot Seat share a few questions; don't ask the same one twice in a round.
    const prev = S.card && S.card.text;
    let next = draw("hot");
    for (let tries = 0; next.text === prev && tries < 3; tries++) next = draw("hot");
    S.card = next; S.kind = "hot"; S.phase = "hot"; render();
  },
  pass() { if (!S.passes[S.loser]) return; S.passes[S.loser]--; actions.done(); },
  answered() { nextRound(); render(); },
  passhot() { if (!S.passes[S.loser]) return; S.passes[S.loser]--; nextRound(); render(); },
  timer(el) { startTimer(el, Number(el.dataset.secs)); },
  end() {
    if (S.phase === "end") return;
    S.forfeit = FORFEITS[Math.floor(Math.random() * FORFEITS.length)];
    S.phase = "end";
    render();
  },
  again() { S = freshGame(S.names, S.mode, S.roles); S.card = draw("duel"); S.phase = "duel"; render(); },
  home() { S = freshGame(S.names, S.mode, S.roles); render(); },
  custom() { S.prev = S.phase; S.phase = "custom"; render(); },
  back() { S.phase = S.prev && S.prev !== "custom" ? S.prev : "setup"; render(); },
  cheat(el) { customHeat = Number(el.dataset.v); document.querySelectorAll("[data-act=cheat]").forEach(b => b.classList.toggle("on", b === el)); },
  add() {
    const box = document.getElementById("ctext");
    const text = box.value.trim();
    if (!text) { box.focus(); return; }
    const type = document.getElementById("ctype").value;
    const forWho = document.getElementById("cfor").value;
    custom.push({ type, h: customHeat, text, for: forWho });
    writeJSON(CUSTOM_KEY, custom);
    for (const k in decks) delete decks[k];
    render();
    document.getElementById("ctype").value = type;
    document.getElementById("cfor").value = forWho;
  },
  del(el) {
    custom.splice(Number(el.dataset.i), 1);
    writeJSON(CUSTOM_KEY, custom);
    for (const k in decks) delete decks[k];
    render();
  }
};

document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
});

if (!views[S.phase]) S.phase = "setup";
if (S.phase === "custom") S.phase = S.prev && S.prev !== "custom" ? S.prev : "setup";
render();
</script>
</body>
</html>
